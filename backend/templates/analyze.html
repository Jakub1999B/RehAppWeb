<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Exercises</title>
</head>
<body>
    <header>
        <nav>
            <ul class="left-links">
                <li><a href="/trainings">Trainings</a></li>
                <li><a href="/analyze">Analyze</a></li>
            </ul>
        </nav>
        <div class="center-logo">
            <a href="/">
                <img src="/static/logo.png" alt="RehApp Logo">
            </a>
            <span class="logo-text">RehApp</span>
        </div>
        <nav>
            <ul class="right-links">
                <li><a href="/exercises">Exercises</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">


        <h2>Analyze</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" accept=".xlsx, .csv" required>
            <button type="button" id="analyze-button">Analyze</button>
        </form>
        <div id="loading-container" style="display: none;" class="loading-container">
            <div>Loading...</div>
        </div>
        <div id="result-container">
            <!-- Rectangles for displaying the results -->
            <div class="result-box">
                <div class="result-label">Bend</div>
                <div class="result-value" id="bend-result"></div>
            </div>
            <div class="result-box">
                <div class="result-label">Circular Raise</div>
                <div class="result-value" id="circular-raise-result"></div>
            </div>
            <div class="result-box">
                <div class="result-label">Abduction</div>
                <div class="result-value" id="abduction-result"></div>
            </div>
            <div class="result-box">
                <div class="result-label">Rear Touch</div>
                <div class="result-value" id="rear-touch-result"></div>
            </div>
            <div class="result-box">
                <div class="result-label">Side Bend</div>
                <div class="result-value" id="side-bend-result"></div>
            </div>
        </div>


    </div>


</body>

<script>
    document.getElementById('analyze-button').addEventListener('click', async () => {
        const fileInput = document.getElementById('file-input');
        const loadingContainer = document.getElementById('loading-container');
        const resultContainer = document.getElementById('result-container');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            loadingContainer.style.display = 'flex'; // Display loading process
            resultContainer.style.display = 'none'; // Hide result container

            const response = await fetch('/analyzes/', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('bend-result').textContent = result.BEND || '0';
                document.getElementById('circular-raise-result').textContent = result.CIRCULAR_RAISE || '0';
                document.getElementById('abduction-result').textContent = result.ABDUCTION || '0';
                document.getElementById('rear-touch-result').textContent = result.REAR_TOUCH || '0';
                document.getElementById('side-bend-result').textContent = result.SIDE_BEND || '0';

                loadingContainer.style.display = 'none'; // Hide loading process
                resultContainer.style.display = 'block'; // Display result container
            } else {
                console.error('Analyze request failed.');
                loadingContainer.style.display = 'none'; // Hide loading process on error
            }
        } catch (error) {
            console.error('An error occurred:', error);
            loadingContainer.style.display = 'none'; // Hide loading process on error
        }
    });
</script>


</html>
