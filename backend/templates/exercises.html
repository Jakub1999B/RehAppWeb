<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Exercises</title>
</head>
<body>
    <header>
        <nav>
            <ul class="left-links">
                <li><a href="/trainings">Trainings</a></li>
                <li><a href="/analyze">Analyze</a></li>
            </ul>
        </nav>
        <div class="center-logo">
            <a href="/">
                <img src="/static/logo.png" alt="RehApp Logo">
            </a>
            <span class="logo-text">RehApp</span>
        </div>
        <nav>
            <ul class="right-links">
                <li><a href="/exercises">Exercises</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="content">
        <div class="exercise-list">
            <div class="exercise" data-title="Bend">
                Bend
                <span class="arrow">&#9660;</span>
                <div class="exercise-details">
                    <p class="exercise-details-text">Description of Bend exercise.</p>
                    <img src="/static/wer.png" alt="Bend Exercise">
                </div>
            </div>
            <div class="exercise" data-title="CircularRaise">
                Circular raise
                <span class="arrow">&#9660;</span>
                <div class="exercise-details">
                    <p class="exercise-details-text">Description of Bend exercise.</p>
                    <img src="logo.png" alt="CircularRaise Exercise">
                </div>
            </div>
            <div class="exercise" data-title="Abduction">
                Abduction
                <span class="arrow">&#9660;</span>
                <div class="exercise-details">
                    <p class="exercise-details-text">Description of Bend exercise.</p>
                    <img src="logo.png" alt="Abduction Exercise">
                </div>
            </div>
            <div class="exercise" data-title="RearTouch">
                Rear touch
                <span class="arrow">&#9660;</span>
                <div class="exercise-details">
                    <p class="exercise-details-text">Description of Bend exercise.</p>
                    <img src="logo.png" alt="RearTouch Exercise">
                </div>
            </div>
            <div class="exercise" data-title="SideBend">
                Side bend
                <span class="arrow">&#9660;</span>
                <div class="exercise-details">
                    <p class="exercise-details-text">Description of Bend exercise.</p>
                    <img src="logo.png" alt="SideBend Exercise">
                </div>
            </div>
        </div>
    </div>

</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const exercises = document.querySelectorAll('.exercise');

        exercises.forEach(exercise => {
            const arrow = exercise.querySelector('.arrow'); // Select the arrow within the exercise
            const exerciseDetails = exercise.querySelector('.exercise-details');

            exercise.addEventListener('click', () => {
                exerciseDetails.classList.toggle('show');
                arrow.classList.toggle('rotate'); // Toggle the rotate class on the arrow
            });
        });
    });
</script>

</html>
