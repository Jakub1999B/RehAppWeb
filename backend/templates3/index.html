<!DOCTYPE html>
<html>
<head>
    <title>Excel File Processing</title>
    <script src="{{ url_for('static', path='plotly.min.js') }}"></script>
</head>
<body>
    <h1>Excel File Processing</h1>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload File</button>
    <p>Uploaded file: <span id="filename"></span></p>
    <button id="calculateButton" onclick="calculateAndPlot()" disabled>Calculate and Plot</button>
    <div id="plot"></div>
    <script>
        function uploadFile() {
            const inputElement = document.getElementById("fileInput");
            const file = inputElement.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            fetch("/uploadfile/", {
                method: "POST",
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if ("filename" in data) {
                    document.getElementById("filename").textContent = data.filename;
                    document.getElementById("calculateButton").disabled = false;
                }
            });
        }

        function calculateAndPlot() {
            fetch("/calculateplot/")
            .then(response => response.json())
            .then(data => {
                const x = data.x;
                const y = data.y;

                const trace = {
                    x: x,
                    y: y,
                    mode: 'lines',
                    type: 'scatter'
                };

                const layout = {
                    title: 'Plot of Data',
                    xaxis: { title: 'X Axis' },
                    yaxis: { title: 'Y Axis' }
                };

                Plotly.newPlot('plot', [trace], layout);
            });
        }
    </script>
</body>
</html>
